name: evidence-rendering-validation

on:
  pull_request:
    paths:
      - "packages/domain/src/evidence-rendering.ts"
      - "packages/domain/src/evidence-rendering.test.ts"
      - "packages/domain/package.json"
      - ".github/workflows/evidence-rendering.yml"

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck evidence domain
        run: npm run typecheck --workspace=packages/domain

      - name: Test evidence domain
        run: npm run test --workspace=packages/domain
