name: regime-assessment-check

on:
  push:
    branches: [agent/regime-assessment-pack]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=packages/experiment-engine
      - run: npm run test --workspace=packages/experiment-engine
