name: clean-checkout-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ace-omni-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      XDG_CONFIG_HOME: /tmp/ace-omni-xdg-ci
      ELIXIP_DIR: ${{ github.workspace }}/.elixip-upstream
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use Java for JAIN SLEE conformance port
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ports/jain-slee/pom.xml

      - name: Use Elixir for Elixip conformance port
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Check out pinned Elixip runtime
        uses: actions/checkout@v4
        with:
          repository: neutrino38/elixip
          ref: fd0f7bf703dddfcefcf2cb28205776a5a402e192
          path: .elixip-upstream
          persist-credentials: false

      - name: Compile and test JAIN SLEE conformance port
        run: mvn -B -f ports/jain-slee/pom.xml test

      - name: Compile pinned Elixip scenario runtime
        working-directory: .elixip-upstream/apps/elixip2
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: Reject NUL-corrupted tracked source
        run: npm run check:integrity

      - name: Reject semantic-token drift
        run: npm run tokens:check

      - name: Install from lockfile
        run: npm ci

      - name: Reject known dependency vulnerabilities
        run: npm run audit:dependencies

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply migrations and seed isolated synthetic data
        run: npm run test:e2e:prepare

      - name: Verify generated Worker binding types
        run: npm run types:check --workspace=apps/worker

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Build web assets and dry-run the Worker bundle
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Execute Omni fixtures through pinned Elixip
        run: npm run test:conformance:elixip

      - name: Compare Cloudflare, SLEE, and Elixip Omni Core semantic traces
        run: npm run test:conformance

      - name: Run Worker, D1, R2, and Durable Object integration tests
        run: npm run test:integration

      - name: Run two-context synthetic-media vertical slice
        run: npm run test:e2e --workspace=packages/test-support

      - name: Preserve browser screenshots, traces, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-omni-browser-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/playwright
            packages/test-support/playwright-report
            conformance/generated
